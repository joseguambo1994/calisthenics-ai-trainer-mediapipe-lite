name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1) Login to Docker Hub (ONLY on main pushes)
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 2) Build (always)
      - name: Build the Docker image
        run: |
          docker build . --file Dockerfile --tag ${{ secrets.DOCKERHUB_USERNAME }}/calisthenics-api:${{ github.sha }}

      # 3) Push (ONLY on main pushes)
      - name: Push the Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/calisthenics-api:${{ github.sha }}

      # 4) Also tag/push "latest" (ONLY on main pushes)
      - name: Tag and push latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/calisthenics-api:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/calisthenics-api:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/calisthenics-api:latest
